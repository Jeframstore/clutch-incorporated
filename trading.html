<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Trading</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trading.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="trading-container">
        <div class="trading-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
        </div>

        <div class="trading-layout">
            <div class="trading-main">
                <div class="coin-info-header">
                    <h2 id="selectedCoinName">BTC/USDT</h2>
                    <p id="selectedCoinPrice" class="current-price">0.00</p>
                    <div class="price-change" id="selectedCoinChange">0.00%</div>
                </div>

                <div class="order-book-section">
                    <h3>Order Book</h3>
                    <div class="order-book">
                        <div class="order-book-header">
                            <span>Price</span>
                            <span>Amount</span>
                            <span>Total</span>
                        </div>
                        <div class="order-book-asks" id="orderBookAsks">
                            <div class="order-book-row">
                                <span class="price">--</span>
                                <span class="amount">--</span>
                                <span class="total">--</span>
                            </div>
                        </div>
                        <div class="order-book-mid" id="orderBookMid">--</div>
                        <div class="order-book-bids" id="orderBookBids">
                            <div class="order-book-row">
                                <span class="price">--</span>
                                <span class="amount">--</span>
                                <span class="total">--</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="trade-history-section">
                    <h3>Trade History</h3>
                    <div class="trade-history" id="tradeHistory">
                        <div class="trade-history-row">
                            <span class="time">--</span>
                            <span class="price">--</span>
                            <span class="amount">--</span>
                            <span class="type">--</span>
                        </div>
                    </div>
                </div>

                <div class="coins-section">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search coins...">
                    </div>
                    <div class="coins-list" id="coinsList">
                        <div class="loading">Loading coins...</div>
                    </div>
                </div>
            </div>

            <div class="trading-sidebar">
                <div class="trade-buttons">
                    <button class="trade-type-btn active" data-type="buy">Buy</button>
                    <button class="trade-type-btn" data-type="sell">Sell</button>
                </div>

                <div class="trade-tabs">
                    <button class="trade-tab-btn active" data-tab="limit">Limit</button>
                    <button class="trade-tab-btn" data-tab="market">Market</button>
                </div>

                <div class="trading-form">
                    <div class="balance-info">
                        <span>Available</span>
                        <span id="tradingBalance">0.00 USDT</span>
                    </div>

                    <div class="form-group">
                        <label>Price</label>
                        <div class="input-with-controls">
                            <input type="number" id="tradePrice" placeholder="Price" min="0" step="0.0001">
                            <button class="control-btn up">▲</button>
                            <button class="control-btn down">▼</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="tradeAmount" placeholder="Amount" min="0" step="0.01">
                    </div>

                    <div class="slider-section">
                        <input type="range" id="amountSlider" min="0" max="100" value="0" class="trade-slider">
                        <div class="slider-labels">
                            <span>0%</span>
                            <span>25%</span>
                            <span>50%</span>
                            <span>75%</span>
                            <span>100%</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Total</label>
                        <input type="number" id="tradeTotal" placeholder="Total" min="0" step="0.01" readonly>
                    </div>

                    <button class="trade-btn" id="buyBtn">Buy</button>
                    <button class="trade-btn sell" id="sellBtn" style="display: none;">Sell</button>
                </div>

                <div class="assets-section">
                    <h3>Assets</h3>
                    <div class="assets-list" id="assetsList">
                        <div class="asset-item">
                            <span class="asset-name">USDT</span>
                            <span class="asset-balance" id="usdtBalance">0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Tasks</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/trading.js"></script>
</body>
</html>
