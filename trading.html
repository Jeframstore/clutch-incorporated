<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }
        
        .trade-type-btn.active.buy { background-color: #80FF00; color: black; box-shadow: 0 0 20px rgba(128, 255, 0, 0.3); }
        .trade-type-btn.active.sell { background-color: #FF4B4B; color: white; box-shadow: 0 0 20px rgba(255, 75, 75, 0.3); }
        .trade-tab-btn.active { border-bottom: 2px solid #FFD800; color: #FFD800; }
        
        .positive { color: #80FF00; }
        .negative { color: #FF4B4B; }
        .sell-row { color: #FF4B4B; opacity: 0.9; }
        .buy-row { color: #80FF00; opacity: 0.9; }
        
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .coin-item { cursor: pointer; border-radius: 1rem; transition: all 0.2s; }
        .coin-item:hover { background: rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Live Trading • <span id="selectedCoinName">BTC/USDT</span> • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="p-4 space-y-4 flex-1">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="font-jakarta text-2xl font-extrabold tracking-tight" id="selectedCoinName">BTC/USDT</h1>
                    <span class="text-[8px] font-bold text-[#80FF00] tracking-[0.2em] uppercase">Live Execution</span>
                </div>
                <div class="text-right">
                    <p class="text-lg font-bold tabular-nums tracking-tighter" id="selectedCoinPrice">0.0000</p>
                    <p class="text-[9px] font-black uppercase tracking-widest" id="selectedCoinChange">+0.00%</p>
                </div>
            </div>
            <section class="grid grid-cols-2 gap-3 h-[280px]">
                <div class="bg-[#1B1B1B] rounded-2xl p-3 border border-white/5 flex flex-col overflow-hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-[9px] font-black text-white/30 uppercase tracking-[0.2em]">Order Book</h3>
                        <span class="text-[8px] text-white/20">USDT</span>
                    </div>
                    <div class="flex-1 space-y-1 no-scrollbar overflow-y-auto text-[10px] font-mono">
                        <div id="orderBookAsks" class="space-y-1 sell-row"></div>
                        <div id="orderBookMid" class="py-2 text-center font-bold text-lg text-[#80FF00] border-y border-white/5 my-2 backdrop-blur-sm">0.0000</div>
                        <div id="orderBookBids" class="space-y-1 buy-row"></div>
                    </div>
                </div>
                <div class="bg-[#1B1B1B] rounded-2xl p-3 border border-white/5 flex flex-col overflow-hidden">
                    <h3 class="text-[9px] font-black text-white/30 uppercase tracking-[0.2em] mb-3">Market History</h3>
                    <div id="tradeHistory" class="flex-1 space-y-2.5 no-scrollbar overflow-y-auto text-[10px] font-mono"></div>
                </div>
            </section>

            <section class="bg-[#1B1B1B] rounded-[32px] p-6 border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] space-y-6 relative overflow-hidden">
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-[#FFD800]/5 blur-[40px] rounded-full"></div>
                
                <div class="flex gap-1.5 bg-black/40 p-1.5 rounded-2xl relative z-10">
                    <button class="flex-1 py-3 text-xs font-black rounded-xl trade-type-btn active buy" data-type="buy">BUY</button>
                    <button class="flex-1 py-3 text-xs font-black rounded-xl trade-type-btn sell" data-type="sell">SELL</button>
                </div>

                <div class="flex gap-6 border-b border-white/5 relative z-10">
                    <button class="pb-2.5 text-[10px] font-black uppercase tracking-widest trade-tab-btn active" data-tab="limit">Limit Order</button>
                    <button class="pb-2.5 text-[10px] font-black uppercase tracking-widest trade-tab-btn" data-tab="market">Market Price</button>
                </div>

                <div class="space-y-5 relative z-10">
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em]">Execution Price</label>
                        <div class="relative group">
                            <input type="number" id="tradePrice" step="0.0001" class="w-full bg-black/60 border border-white/5 group-hover:border-[#FFD800]/40 focus:border-[#FFD800] rounded-2xl px-5 py-4 text-sm font-bold font-mono transition-all outline-none">
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-3">
                                <button class="control-btn down text-white/20 hover:text-white transition-colors"><i class="ti ti-minus"></i></button>
                                <button class="control-btn up text-white/20 hover:text-white transition-colors"><i class="ti ti-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em]">Trade Amount</label>
                        <div class="relative group">
                            <input type="number" id="tradeAmount" placeholder="0.00" class="w-full bg-black/60 border border-white/5 group-hover:border-[#FFD800]/40 focus:border-[#FFD800] rounded-2xl px-5 py-4 text-sm font-bold font-mono transition-all outline-none">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em]">Trade Duration</label>
                        <div class="relative group">
                            <select id="tradeDuration" class="w-full bg-black/60 border border-white/5 group-hover:border-[#FFD800]/40 focus:border-[#FFD800] rounded-2xl px-5 py-4 text-sm font-bold font-mono transition-all outline-none appearance-none cursor-pointer">
                                <option value="5">5 Minutes</option>
                                <option value="10">10 Minutes</option>
                                <option value="25">25 Minutes</option>
                                <option value="30">30 Minutes</option>
                                <option value="60">1 Hour</option>
                                <option value="360">6 Hours</option>
                                <option value="720">12 Hours</option>
                                <option value="1440">24 Hours</option>
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                                <i class="ti ti-chevron-down text-white/40"></i>
                            </div>
                        </div>
                    </div>

                    <div class="px-1">
                        <input type="range" id="amountSlider" min="0" max="100" value="0" class="w-full h-1.5 bg-white/5 rounded-full appearance-none accent-[#FFD800] cursor-pointer">
                        <div class="flex justify-between mt-3 text-[8px] font-black text-white/20 uppercase tracking-widest">
                            <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em]">Estimated Total (USDT)</label>
                        <input type="number" id="tradeTotal" readonly class="w-full bg-white/5 border border-white/5 rounded-2xl px-5 py-4 text-sm font-bold font-mono text-white/30 outline-none">
                    </div>
                </div>

                <div class="pt-2 border-t border-white/5 relative z-10">
                    <div class="flex justify-between text-[10px] font-bold mb-5 px-1">
                        <span class="text-white/40 uppercase tracking-widest">Available Balance</span>
                        <div class="flex gap-2">
                            <span id="tradingBalance" class="text-white">0.00 USDT</span>
                            <span id="usdtBalance" class="hidden">0.00</span>
                        </div>
                    </div>
                    <button id="buyBtn" class="w-full py-5 bg-[#80FF00] text-black font-black rounded-[20px] shadow-[0_15px_30px_rgba(128,255,0,0.2)] uppercase tracking-[0.2em] text-sm active:scale-95 transition-all">Execute Buy BTC</button>
                    <button id="sellBtn" class="w-full py-5 bg-[#FF4B4B] text-white font-black rounded-[20px] shadow-[0_15px_30px_rgba(255,75,75,0.2)] uppercase tracking-[0.2em] text-sm active:scale-95 transition-all" style="display: none;">Execute Sell BTC</button>
                </div>
            </section>

            <section class="bg-[#1B1B1B] rounded-[24px] p-5 border border-white/5">
                <input type="text" id="searchInput" placeholder="Search Asset Symbols..." class="w-full bg-black/40 border border-white/5 focus:border-[#FFD800]/40 rounded-xl py-3.5 pl-4 pr-4 text-xs font-bold tracking-wide outline-none transition-all">
                <div id="coinsList" class="space-y-2 mt-4 max-h-[400px] overflow-y-auto no-scrollbar"></div>
            </section>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="records">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-list text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/trading.js"></script>
</body>
</html>
