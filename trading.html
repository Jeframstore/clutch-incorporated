<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Trading</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trading.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="trading-container">
        <div class="trading-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
            <h1 class="page-title">Crypto Trading</h1>
        </div>

        <div class="balance-display">
            <p>Available Balance</p>
            <p class="balance-amount" id="tradingBalance">0.00 USDT</p>
        </div>

        <div class="selected-coin" id="selectedCoinSection" style="display: none;">
            <div class="coin-header">
                <h2 id="selectedCoinName">BTC/USDT</h2>
                <p id="selectedCoinPrice" class="current-price">0.00</p>
            </div>
            <div class="price-change" id="selectedCoinChange">0.00%</div>
        </div>

        <div class="trading-tabs">
            <button class="tab-btn active" data-tab="buy">Buy</button>
            <button class="tab-btn" data-tab="sell">Sell</button>
        </div>

        <div class="trading-form">
            <div class="form-group">
                <label>Amount (USDT)</label>
                <input type="number" id="tradeAmount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" id="tradePrice" placeholder="Current price" min="0" step="0.0001" readonly>
            </div>
            <div class="form-group">
                <label>Total (USDT)</label>
                <input type="number" id="tradeTotal" placeholder="Total" min="0" step="0.01" readonly>
            </div>
            <div class="quick-amounts">
                <button class="quick-btn" data-percent="25">25%</button>
                <button class="quick-btn" data-percent="50">50%</button>
                <button class="quick-btn" data-percent="75">75%</button>
                <button class="quick-btn" data-percent="100">100%</button>
            </div>
            <button class="trade-btn" id="buyBtn">Buy</button>
            <button class="trade-btn sell" id="sellBtn" style="display: none;">Sell</button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search coins...">
        </div>

        <div class="coins-list" id="coinsList">
            <div class="loading">Loading coins...</div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Tasks</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/trading.js"></script>
</body>
</html>
