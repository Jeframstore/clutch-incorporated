<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Trading - Clutch Revenue</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img id="siteLogo" src="assets/images/logo.svg" alt="Logo" onerror="this.style.display='none'">
                <span class="company-name">Clutch Incorporated</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Home</a>
                <a href="deposit.html">💳 Deposit</a>
                <a href="withdraw.html">💰 Withdraw</a>
                <a href="terms.html">📋 Terms & Conditions</a>
                <a href="faqs.html">❓ FAQS</a>
                <a href="about.html">ℹ️ About</a>
                <div class="sidebar-divider"></div>
                <a href="bind-wallet.html">🔗 Bind Wallet</a>
                <a href="service.html">📞 Contact Us</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="tasks-btn" onclick="location.href='starting.html'">TASKS</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Trading</h1>
                <p class="page-description">Trade with live market prices</p>
            </div>
            
            <div class="coins-grid" id="tradingCoinsGrid"></div>
            
            <div class="card">
                <div class="card-title">🚀 Execute Trade</div>
                
                <div class="form-group">
                    <label>Select Coin</label>
                    <select id="tradeCoin" class="form-control">
                        <option value="BTCUSDT">Bitcoin (BTC)</option>
                        <option value="ETHUSDT">Ethereum (ETH)</option>
                        <option value="BNBUSDT">Binance Coin (BNB)</option>
                        <option value="SOLUSDT">Solana (SOL)</option>
                        <option value="XRPUSDT">Ripple (XRP)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Amount (USDT)</label>
                    <input type="number" id="tradeAmount" placeholder="Enter amount" step="0.01">
                </div>
                
                <div class="form-group">
                    <label>Time Frame</label>
                    <select id="tradeTimeframe">
                        <option value="5">5 minutes</option>
                        <option value="10">10 minutes</option>
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="60">1 hour</option>
                        <option value="360">6 hours</option>
                        <option value="720">12 hours</option>
                        <option value="1440">24 hours</option>
                    </select>
                </div>
                
                <button class="submit-btn" id="executeTradeBtn">Execute Trade</button>
            </div>
            
            <div class="card">
                <div class="card-title">⏳ My Open Trades</div>
                <div id="openTradesList" style="min-height: 100px;">
                    <div style="text-align: center; padding: 20px; color: #888;">No open trades</div>
                </div>
            </div>
        </main>

        <aside class="profile-panel">
            <div class="profile-content">
                <div class="avatar">👤</div>
                <div class="username" id="profileUsername">Loading...</div>
                <div class="section-title">ACCOUNT</div>
                <div class="account-details">
                    <p><span class="label">Joined:</span><span class="value" id="profileJoined">-</span></p>
                    <p><span class="label">Invite Code:</span><span class="value" id="profileInviteCode">-</span></p>
                    <p><span class="label">Balance:</span><span class="value" id="profileBalance">0 USDT</span></p>
                </div>
                <div class="section-title">ASSETS</div>
                <div class="coins-list" id="profileCoinsList"></div>
                <div class="dropdown-trigger" id="dropdownTrigger">▼ More Coins</div>
                <div class="dropdown-coins" id="dropdownCoins"></div>
            </div>
            <div class="profile-bottom">
                <button class="tradenow-btn active" onclick="location.href='trading.html'">TRADE NOW</button>
            </div>
        </aside>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/main-layout.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        // priceUpdateInterval is already declared in main-layout.js - DO NOT REDECLARE
        let countdownIntervals = {};
        
        async function loadTradingPrices() {
            const symbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT'];
            const container = document.getElementById('tradingCoinsGrid');
            container.innerHTML = '';
            
            for (const symbol of symbols) {
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                    const data = await response.json();
                    const price = parseFloat(data.lastPrice).toFixed(2);
                    const change = parseFloat(data.priceChangePercent).toFixed(2);
                    const changeClass = change >= 0 ? 'positive' : 'negative';
                    const changeSign = change >= 0 ? '▲' : '▼';
                    const name = symbol.replace('USDT', '');
                    
                    container.innerHTML += `
                        <div class="coin-card">
                            <h4>${name}</h4>
                            <div class="price">$${price}</div>
                            <div class="change ${changeClass}">${changeSign} ${Math.abs(change)}%</div>
                        </div>
                    `;
                } catch(e) { console.error(e); }
            }
        }
        
        async function loadOpenTrades() {
            const tradesSnap = await database.ref('trades').once('value');
            const trades = tradesSnap.val() || {};
            const container = document.getElementById('openTradesList');
            
            let html = '';
            for (let id in trades) {
                const trade = trades[id];
                if (trade.userId === userId && trade.status === 'pending') {
                    const remaining = trade.endTime - Date.now();
                    html += `
                        <div class="trade-item" id="trade-${id}" style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; margin-bottom: 10px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #9b59b6;">${trade.symbol}/USDT</span>
                                <span>${trade.amount} USDT</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #888;">
                                <span>Entry: $${trade.entryPrice}</span>
                                <span>Time: ${trade.timeframe} min</span>
                            </div>
                            <div class="trade-countdown" data-end="${trade.endTime}" style="margin-top: 8px; text-align: center; font-family: monospace;">${formatTime(remaining)}</div>
                        </div>
                    `;
                }
            }
            
            container.innerHTML = html || '<div style="text-align: center; padding: 20px; color: #888;">No open trades</div>';
            
            document.querySelectorAll('.trade-countdown').forEach(el => {
                const endTime = parseInt(el.dataset.end);
                startCountdown(el, endTime);
            });
        }
        
        function formatTime(ms) {
            if (ms <= 0) return 'Expired';
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function startCountdown(element, endTime) {
            const interval = setInterval(() => {
                const remaining = endTime - Date.now();
                if (remaining <= 0) {
                    clearInterval(interval);
                    element.textContent = 'Complete - Pending Admin';
                    element.style.color = '#00ff00';
                    loadOpenTrades();
                } else {
                    element.textContent = formatTime(remaining);
                }
            }, 1000);
        }
        
        document.getElementById('executeTradeBtn').addEventListener('click', async () => {
            const pair = document.getElementById('tradeCoin').value;
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            const timeframe = parseInt(document.getElementById('tradeTimeframe').value);
            
            if (!amount || amount <= 0) {
                Swal.fire('Error', 'Enter valid amount', 'error');
                return;
            }
            
            const userSnap = await database.ref('users/' + userId).once('value');
            const user = userSnap.val();
            
            if (amount > parseFloat(user.balance || 0)) {
                Swal.fire('Error', 'Insufficient balance', 'error');
                return;
            }
            
            const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${pair}`);
            const data = await response.json();
            const currentPrice = parseFloat(data.price);
            const endTime = Date.now() + (timeframe * 60 * 1000);
            const tradeId = 'TRD' + Date.now();
            
            await database.ref('users/' + userId).update({
                balance: (parseFloat(user.balance || 0) - amount).toFixed(2)
            });
            
            await database.ref('trades/' + tradeId).set({
                id: tradeId,
                userId: userId,
                username: user.username,
                symbol: pair.replace('USDT', ''),
                amount: amount,
                entryPrice: currentPrice,
                timeframe: timeframe,
                endTime: endTime,
                status: 'pending',
                requestDate: new Date().toISOString()
            });
            
            Swal.fire('Success', `Trade executed! Amount: ${amount} USDT`, 'success');
            document.getElementById('tradeAmount').value = '';
            await loadOpenTrades();
            await loadUserProfile();
        });
        
        loadTradingPrices();
        loadOpenTrades();
        // Use the existing priceUpdateInterval from main-layout.js
        if (typeof priceUpdateInterval !== 'undefined') {
            clearInterval(priceUpdateInterval);
        }
        window.priceUpdateInterval = setInterval(loadTradingPrices, 30000);
    </script>
</body>
</html>
