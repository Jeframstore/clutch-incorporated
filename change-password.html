<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Change Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/change-password.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="password-container">
        <div class="password-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
            <h1 class="page-title">Change Password</h1>
        </div>

        <div class="password-form">
            <div class="input-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password">
            </div>

            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>

            <button class="submit-btn" id="changePasswordBtn">Update Password</button>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Starting</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/change-password.js"></script>
</body>
</html>
