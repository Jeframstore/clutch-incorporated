<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Terms</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }

        .terms-section { background: #1B1B1B; padding: 1.75rem; border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 1.5rem; }
        .terms-section h3 { color: #FFD800; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 0.95rem; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.15em; border-left: 3px solid #FFD800; padding-left: 1rem; }
        .terms-section p { font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); line-height: 1.7; margin-bottom: 0.8rem; }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Legal Framework • Terms & Conditions • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-6">
            <div class="mb-10">
                <h1 class="font-jakarta text-3xl font-extrabold tracking-tight uppercase">Legal <span class="text-[#FFD800]">Framework</span></h1>
                <p class="text-white/30 text-[9px] font-black uppercase tracking-[0.3em] mt-2">Operational Protocol v4.0</p>
            </div>

            <div id="termsContent" class="space-y-4">
                <div class="flex flex-col items-center justify-center py-20 opacity-20">
                    <i class="ti ti-loader animate-spin text-3xl mb-4"></i>
                    <p class="text-xs font-bold uppercase tracking-widest text-center">Syncing Legal Ledger...</p>
                </div>
            </div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="records">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-list text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/terms.js"></script>
</body>
</html>
