<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Records</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }

        .tab-btn.active { background: #FFD800; color: #000; box-shadow: 0 10px 20px -5px rgba(255, 216, 0, 0.3); }
        .record-item { 
            background: linear-gradient(145deg, #1B1B1B 0%, #121212 100%); 
            border: 1px solid rgba(255, 255, 255, 0.03); 
            padding: 1.25rem;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .status-confirmed { background: rgba(128, 255, 0, 0.1); color: #80FF00; }
        .status-pending { background: rgba(255, 216, 0, 0.1); color: #FFD800; }
        .status-rejected { background: rgba(255, 75, 75, 0.1); color: #FF4B4B; }
        
        .positive { color: #80FF00; }
        .negative { color: #FF4B4B; }
        
        .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .record-details { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 0.75rem; }
        .record-status { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.75rem; }
        .status-badge { font-size: 0.6rem; font-weight: 900; padding: 0.25rem 0.75rem; border-radius: 9999px; text-transform: uppercase; }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Transaction History • View All Your Records • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-6">
            <div class="mb-8">
                <h1 class="font-jakarta text-3xl font-extrabold tracking-tight">Audit <span class="text-[#FFD800]">Records</span></h1>
            </div>

            <div class="flex items-center p-1.5 bg-[#1B1B1B]/60 rounded-[20px] border border-white/5 mb-8">
                <button class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all tab-btn active" data-tab="all">All Logs</button>
                <button class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all tab-btn text-white/40" data-tab="deposit">Credits</button>
                <button class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all tab-btn text-white/40" data-tab="withdraw">Debits</button>
            </div>

            <div id="recordsList" class="space-y-4"></div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn active" data-page="records">
                <div class="w-12 h-12 rounded-2xl bg-[#FFD800]/10 flex items-center justify-center relative">
                    <i class="ti ti-list text-[#FFD800] text-2xl"></i>
                    <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#FFD800] rounded-full nav-indicator"></div>
                </div>
                <span class="text-[#FFD800] text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/records.js"></script>
</body>
</html>
