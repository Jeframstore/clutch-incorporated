<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>Testing Firebase Connection</h1>
    <div id="status">Checking...</div>
    <div id="data"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBwf-rkEWsNJRkh_TJeMSoNDc1iwO1c6tI",
            authDomain: "clutch-incorporated.firebaseapp.com",
            projectId: "clutch-incorporated",
            storageBucket: "clutch-incorporated.firebasestorage.app",
            messagingSenderId: "515595231583",
            appId: "1:515595231583:web:73ff8c3cdc123dcbce16ea",
            databaseURL: "https://clutch-incorporated-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        document.getElementById('status').innerHTML = 'Firebase initialized!';
        
        // Test write
        database.ref('test').set({
            message: 'Hello Firebase!',
            timestamp: new Date().toISOString()
        }).then(() => {
            document.getElementById('status').innerHTML = 'Write successful!';
        }).catch((error) => {
            document.getElementById('status').innerHTML = 'Error: ' + error.message;
        });
        
        // Test read
        database.ref('test').once('value').then((snapshot) => {
            const data = snapshot.val();
            document.getElementById('data').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        });
    </script>
</body>
</html>
