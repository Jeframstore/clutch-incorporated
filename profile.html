<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Profile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }

        .profile-card {
            background: linear-gradient(145deg, #1B1B1B 0%, #121212 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .action-list button { transition: all 0.2s ease; }
        .action-list button:active { background-color: rgba(255, 255, 255, 0.05); transform: scale(0.99); }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Profile Management • View Your Account Details • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-6 space-y-6">
            <!-- User Overview Card -->
            <section class="profile-card rounded-[32px] p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-[#FFD800]/5 rounded-full blur-[50px] -mr-16 -mt-16"></div>
                
                <div class="relative flex items-start justify-between">
                    <div>
                        <h2 class="font-jakarta text-2xl font-bold text-white mb-1.5" id="profileUserName">Loading...</h2>
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-md bg-[#FFD800] text-black text-[9px] font-black uppercase tracking-wider">Premium VIP</span>
                        </div>
                    </div>
                    <div class="bg-black/60 backdrop-blur-md border border-[#80FF00]/30 rounded-2xl px-3 py-2 text-right shadow-[0_0_20px_rgba(128,255,0,0.1)]">
                        <span class="block text-[8px] text-white/40 uppercase font-bold tracking-widest mb-0.5">Trust Score</span>
                        <span class="text-xl font-bold text-[#80FF00] tracking-tight" id="creditScore">97%</span>
                    </div>
                </div>

                <div class="mt-8 pt-5 border-t border-white/5 flex items-center justify-between">
                    <div>
                        <span class="block text-[9px] text-white/30 uppercase font-bold tracking-widest mb-1">Referral Code</span>
                        <span class="font-mono text-xs font-semibold tracking-[0.2em] text-white/90 uppercase" id="inviteCode">Loading...</span>
                    </div>
                    <button class="w-8 h-8 rounded-xl bg-white/5 flex items-center justify-center text-[#FFD800] active:scale-90 transition-transform">
                        <i class="ti ti-copy text-xs"></i>
                    </button>
                </div>
            </section>

            <!-- Asset Summary -->
            <section class="grid grid-cols-2 gap-4">
                <div class="bg-[#1B1B1B] border border-white/5 p-5 rounded-3xl">
                    <span class="block text-[9px] text-white/30 uppercase font-bold tracking-widest mb-2">Wallet</span>
                    <span class="text-lg font-bold text-white tabular-nums" id="profileBalance">0.00 USDT</span>
                </div>
                <div class="bg-[#1B1B1B] border border-white/5 p-5 rounded-3xl">
                    <span class="block text-[9px] text-white/30 uppercase font-bold tracking-widest mb-2">Commissions</span>
                    <span class="text-lg font-bold text-[#80FF00] tabular-nums" id="profileProfits">0.00 USDT</span>
                </div>
            </section>

            <!-- Account Settings List -->
            <section class="bg-[#1B1B1B] border border-white/5 rounded-[32px] overflow-hidden divide-y divide-white/5 action-list">
                <button id="depositBtn" class="w-full px-6 py-4.5 flex items-center justify-between hover:bg-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-[#FFD800]/10 flex items-center justify-center text-[#FFD800] shadow-inner"><i class="ti ti-wallet text-xl"></i></div>
                        <div class="text-left"><span class="block text-sm font-semibold tracking-wide text-white/90">Deposit Funds</span></div>
                    </div>
                    <i class="ti ti-chevron-right text-[10px] text-white/10"></i>
                </button>
                
                <button id="withdrawBtn" class="w-full px-6 py-4.5 flex items-center justify-between hover:bg-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-[#80FF00]/10 flex items-center justify-center text-[#80FF00] shadow-inner"><i class="ti ti-arrow-down-left text-xl"></i></div>
                        <div class="text-left"><span class="block text-sm font-semibold tracking-wide text-white/90">Withdraw</span></div>
                    </div>
                    <i class="ti ti-chevron-right text-[10px] text-white/10"></i>
                </button>
                
                <button id="changePasswordBtn" class="w-full px-6 py-4.5 flex items-center justify-between hover:bg-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white/40"><i class="ti ti-shield text-xl"></i></div>
                        <div class="text-left"><span class="block text-sm font-semibold tracking-wide text-white/90">Security</span></div>
                    </div>
                    <i class="ti ti-chevron-right text-[10px] text-white/10"></i>
                </button>
                
                <button id="bindWalletBtn" class="w-full px-6 py-4.5 flex items-center justify-between hover:bg-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white/40"><i class="ti ti-link text-xl"></i></div>
                        <div class="text-left"><span class="block text-sm font-semibold tracking-wide text-white/90">Wallet Mapping</span></div>
                    </div>
                    <i class="ti ti-chevron-right text-[10px] text-white/10"></i>
                </button>
                
                <button id="contactUsBtn" class="w-full px-6 py-4.5 flex items-center justify-between hover:bg-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white/40"><i class="ti ti-headset text-xl"></i></div>
                        <div class="text-left"><span class="block text-sm font-semibold tracking-wide text-white/90">Concierge</span></div>
                    </div>
                    <i class="ti ti-chevron-right text-[10px] text-white/10"></i>
                </button>
            </section>

            <button id="logoutBtn" class="w-full h-14 rounded-2xl border border-red-500/20 bg-red-500/5 text-red-500 font-black uppercase tracking-[0.3em] text-[11px] flex items-center justify-center gap-3 transition-all hover:bg-red-500/10 active:scale-95">
                <i class="ti ti-logout"></i> Sign Out Account
            </button>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="records">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-list text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
