<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Bind Wallet</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bind-wallet.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="bind-container">
        <div class="bind-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
            <h1 class="revenue-title">Revenue</h1>
            <h2 class="page-title">Bind Wallet Address</h2>
        </div>

        <div class="user-info-card">
            <div class="user-info">
                <p class="user-name" id="userName">Collins-VIP 1</p>
                <p class="invite-code">Invitation Code: <span id="inviteCode">A4832E73</span></p>
                <p class="personal-account">Personal Account</p>
            </div>
            <div class="credit-score">
                <p>Credit score</p>
                <p class="score-value" id="creditScore">97%</p>
            </div>
        </div>

        <div class="balance-card">
            <div class="balance-item">
                <p>Account Balance</p>
                <p class="balance-amount" id="accountBalance">0.00 USDT</p>
            </div>
            <div class="balance-item">
                <p>Total Profits</p>
                <p class="profit-amount" id="totalProfits">0.00 USDT</p>
            </div>
        </div>

        <div class="bind-form">
            <div class="input-group">
                <label for="phoneNumber">Phone number with country code</label>
                <input type="tel" id="phoneNumber" placeholder="+1 234 567 8900">
            </div>

            <div class="input-group">
                <label for="walletAddress">Wallet Address (USDT)</label>
                <input type="text" id="walletAddress" placeholder="Enter or paste your USDT wallet address">
            </div>

            <div class="input-group">
                <label for="withdrawPassword">Withdraw Password</label>
                <input type="password" id="withdrawPassword" placeholder="Set your withdraw password">
            </div>

            <button class="submit-btn" id="submitBindBtn">Submit</button>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Starting</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/bind-wallet.js"></script>
</body>
</html>
