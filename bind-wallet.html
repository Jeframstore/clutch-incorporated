<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bind Wallet - Clutch Revenue</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img id="siteLogo" src="assets/images/logo.png" alt="Logo" onerror="this.style.display='none'">
                <span class="company-name">Clutch Incorporated</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Home</a>
                <a href="deposit.html">💳 Deposit</a>
                <a href="withdraw.html">💰 Withdraw</a>
                <a href="terms.html">📋 Terms & Conditions</a>
                <a href="faqs.html">❓ FAQS</a>
                <a href="about.html">ℹ️ About</a>
                <div class="sidebar-divider"></div>
                <a href="bind-wallet.html">🔗 Bind Wallet</a>
                <a href="service.html">📞 Contact Us</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="tasks-btn" onclick="location.href='starting.html'">TASKS</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Bind Wallet Address</h1>
                <p class="page-description">Link your USDT wallet for withdrawals</p>
            </div>
            
            <div class="card">
                <div class="form-group">
                    <label>Phone Number (with country code)</label>
                    <input type="tel" id="phoneNumber" placeholder="+1 234 567 8900">
                </div>
                
                <div class="form-group">
                    <label>USDT Wallet Address</label>
                    <input type="text" id="walletAddress" placeholder="Enter your USDT wallet address">
                </div>
                
                <div class="form-group">
                    <label>Withdraw Password</label>
                    <input type="password" id="withdrawPassword" placeholder="Set your withdraw password">
                </div>
                
                <button class="submit-btn" id="submitBtn">Save Wallet</button>
            </div>
        </main>

        <aside class="profile-panel">
            <div class="profile-content">
                <div class="avatar">👤</div>
                <div class="username" id="profileUsername">Loading...</div>
                <div class="section-title">ACCOUNT</div>
                <div class="account-details">
                    <p><span class="label">Joined:</span><span class="value" id="profileJoined">-</span></p>
                    <p><span class="label">Invite Code:</span><span class="value" id="profileInviteCode">-</span></p>
                    <p><span class="label">Balance:</span><span class="value" id="profileBalance">0 USDT</span></p>
                </div>
                <div class="section-title">ASSETS</div>
                <div class="coins-list" id="profileCoinsList"></div>
                <div class="dropdown-trigger" id="dropdownTrigger">▼ More Coins</div>
                <div class="dropdown-coins" id="dropdownCoins"></div>
            </div>
            <div class="profile-bottom">
                <button class="tradenow-btn" onclick="location.href='trading.html'">TRADE NOW</button>
            </div>
        </aside>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/main-layout.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        
        // Load existing data
        async function loadExisting() {
            const snap = await database.ref('users/' + userId).once('value');
            const user = snap.val();
            if (user) {
                if (user.phone) document.getElementById('phoneNumber').value = user.phone;
                if (user.walletAddress) document.getElementById('walletAddress').value = user.walletAddress;
            }
        }
        loadExisting();
        
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneNumber').value.trim();
            const wallet = document.getElementById('walletAddress').value.trim();
            const password = document.getElementById('withdrawPassword').value;
            
            if (!phone) {
                Swal.fire('Error', 'Phone number required', 'error');
                return;
            }
            if (!wallet || wallet.length < 20) {
                Swal.fire('Error', 'Valid wallet address required', 'error');
                return;
            }
            if (!password || password.length < 4) {
                Swal.fire('Error', 'Withdraw password (min 4 characters)', 'error');
                return;
            }
            
            await database.ref('users/' + userId).update({
                phone: phone,
                walletAddress: wallet,
                withdrawPassword: password
            });
            
            Swal.fire('Success', 'Wallet information saved!', 'success');
            document.getElementById('withdrawPassword').value = '';
        });
    </script>
</body>
</html>
