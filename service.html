<!DOCTYPE html>
<html lang="en">
<head>`n    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Customer Service</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/service.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="service-container">
        <div class="service-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
            <h1 class="page-title">Customer Service</h1>
        </div>

        <div class="contact-options">
            <a href="#" class="contact-card" id="whatsappLink">
                <div class="contact-icon">📱</div>
                <div class="contact-info">
                    <h3>WhatsApp Service</h3>
                    <p id="whatsappNumber">+1 234 567 8900</p>
                </div>
                <div class="contact-arrow">→</div>
            </a>

            <a href="#" class="contact-card" id="telegramLink">
                <div class="contact-icon">✈️</div>
                <div class="contact-info">
                    <h3>Telegram Service</h3>
                    <p id="telegramUsername">@ClutchSupport</p>
                </div>
                <div class="contact-arrow">→</div>
            </a>
        </div>

        <div class="notice-card">
            <p>📞 Support Hours: 10:00 AM - 10:00 PM EST</p>
            <p>⏱ Response time: Within 30 minutes</p>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Starting</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/service.js"></script>
</body>
</html>
