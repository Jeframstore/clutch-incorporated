<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clutch Incorporated - Certificate</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/certificate.css">
    <!-- Firebase SDK -->
    </head>
<body>
    <div class="certificate-container">
        <div class="certificate-header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="big-c">C</div>
                    <div class="logo-text">
                        <span class="clutch">Clutch</span>
                        <span class="incorporated">Incorporated</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">←</button>
            </div>
            <h1 class="page-title">Certificate</h1>
        </div>

        <div class="certificate-content" id="certificateContent">
            <div class="certificate-image-container" id="certificateImageContainer">
                <img id="certificateImage" class="certificate-image" src="" alt="Certificate Image">
                <div class="no-image-placeholder" id="noImagePlaceholder">
                    <span>📜</span>
                    <p>No Certificate Uploaded Yet</p>
                </div>
            </div>
            <div class="certificate-text" id="certificateText"></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-page="starting">
                <span>🚀</span>
                <span>Starting</span>
            </button>
            <button class="nav-btn" data-page="records">
                <span>📊</span>
                <span>Records</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/certificate.js"></script>
</body>
</html>
