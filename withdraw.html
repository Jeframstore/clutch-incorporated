<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Withdraw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }

        .withdraw-form input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; padding: 1.5rem; width: 100%; color: white; outline: none; transition: border 0.3s; font-weight: 600; }
        .withdraw-form input:focus { border-color: #FFD800; background: rgba(0,0,0,0.6); }
        .error-message { background: rgba(255, 75, 75, 0.1); color: #FF4B4B; padding: 1rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 800; text-align: center; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .success-message { background: rgba(128, 255, 0, 0.1); color: #80FF00; padding: 1rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 800; text-align: center; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Priority Payout • Secure Withdrawals • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-6 space-y-8">
            <div>
                <div class="inline-flex items-center gap-2 bg-[#FFD800]/10 border border-[#FFD800]/20 px-3 py-1 rounded-full mb-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-[#FFD800] animate-pulse"></div>
                    <span class="text-[9px] font-black text-[#FFD800] uppercase tracking-widest">Priority Payout</span>
                </div>
                <h1 class="font-jakarta text-4xl font-extrabold tracking-tight">Withdraw</h1>
                <p class="text-white/40 text-xs mt-2">Request fund transfer to your external secure wallet.</p>
            </div>

            <div class="bg-[#1B1B1B] rounded-[40px] p-8 border border-white/5 relative overflow-hidden">
                <p class="text-[9px] font-black text-white/30 uppercase tracking-[0.2em] mb-2">Available for Withdrawal</p>
                <h2 class="text-4xl font-bold tracking-tight text-[#80FF00]" id="withdrawBalance">0.00 USDT</h2>
            </div>

            <div class="withdraw-form space-y-6">
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em] ml-3">Withdrawal Amount (USDT)</label>
                    <input type="number" id="withdrawAmount" placeholder="Min. 10 USDT" step="0.01">
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-white/40 uppercase tracking-[0.2em] ml-3">TRC20 Mapping Status</label>
                    <input type="text" placeholder="Wallet Verified" readonly value="LOCKED TO REGISTERED WALLET" class="opacity-50">
                </div>

                <button id="submitWithdrawBtn" class="w-full bg-[#FFD800] text-black font-black py-5 rounded-[24px] shadow-lg uppercase tracking-[0.2em] text-[13px] active:scale-95 transition-all">
                    Initiate Transfer
                </button>
            </div>

            <div class="pt-6 border-t border-white/5">
                <p class="text-[10px] text-white/20 text-center leading-relaxed font-bold uppercase tracking-widest">
                    Standard Processing: 24 - 48 Hours<br>
                    Operational Fee: 0.00 USDT
                </p>
            </div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="records">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-list text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/withdraw.js"></script>
</body>
</html>
