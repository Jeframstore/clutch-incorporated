<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Withdraw - Clutch Revenue</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img id="siteLogo" src="assets/images/logo.svg" alt="Logo" onerror="this.style.display='none'">
                <span class="company-name">Clutch Incorporated</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Home</a>
                <a href="deposit.html">💳 Deposit</a>
                <a href="withdraw.html">💰 Withdraw</a>
                <a href="terms.html">📋 Terms & Conditions</a>
                <a href="faqs.html">❓ FAQS</a>
                <a href="about.html">ℹ️ About</a>
                <div class="sidebar-divider"></div>
                <a href="bind-wallet.html">🔗 Bind Wallet</a>
                <a href="service.html">📞 Contact Us</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="tasks-btn" onclick="location.href='starting.html'">TASKS</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Withdraw Funds</h1>
                <p class="page-description">Request a withdrawal to your wallet</p>
            </div>
            
            <div class="card">
                <div class="card-title">💰 Withdrawal Request</div>
                
                <div class="form-group">
                    <label>Amount (USDT)</label>
                    <input type="number" id="withdrawAmount" placeholder="Enter amount" min="10" step="0.01">
                    <p style="color:#888; font-size:12px; margin-top:5px;">Minimum withdrawal: 10 USDT</p>
                </div>
                
                <div class="form-group">
                    <label>Wallet Address</label>
                    <input type="text" id="walletAddress" placeholder="Enter your USDT wallet address">
                </div>
                
                <div class="form-group">
                    <label>Withdraw Password</label>
                    <input type="password" id="withdrawPassword" placeholder="Enter your withdraw password">
                </div>
                
                <button class="submit-btn" id="submitBtn">Submit Withdrawal</button>
            </div>
        </main>

        <aside class="profile-panel">
            <div class="profile-content">
                <div class="avatar">👤</div>
                <div class="username" id="profileUsername">Loading...</div>
                <div class="section-title">ACCOUNT</div>
                <div class="account-details">
                    <p><span class="label">Joined:</span><span class="value" id="profileJoined">-</span></p>
                    <p><span class="label">Invite Code:</span><span class="value" id="profileInviteCode">-</span></p>
                    <p><span class="label">Balance:</span><span class="value" id="profileBalance">0 USDT</span></p>
                </div>
                <div class="section-title">ASSETS</div>
                <div class="coins-list" id="profileCoinsList"></div>
                <div class="dropdown-trigger" id="dropdownTrigger">▼ More Coins</div>
                <div class="dropdown-coins" id="dropdownCoins"></div>
            </div>
            <div class="profile-bottom">
                <button class="tradenow-btn" onclick="location.href='trading.html'">TRADE NOW</button>
            </div>
        </aside>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/main-layout.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const amount = document.getElementById('withdrawAmount').value;
            const walletAddress = document.getElementById('walletAddress').value.trim();
            const withdrawPassword = document.getElementById('withdrawPassword').value;
            
            if (!amount || amount < 10) {
                Swal.fire('Error', 'Minimum withdrawal is 10 USDT', 'error');
                return;
            }
            
            if (!walletAddress) {
                Swal.fire('Error', 'Please enter your wallet address', 'error');
                return;
            }
            
            if (!withdrawPassword) {
                Swal.fire('Error', 'Please enter your withdraw password', 'error');
                return;
            }
            
            try {
                const userSnap = await database.ref('users/' + userId).once('value');
                const user = userSnap.val();
                
                if (withdrawPassword !== user.withdrawPassword) {
                    Swal.fire('Error', 'Invalid withdraw password', 'error');
                    return;
                }
                
                if (parseFloat(amount) > parseFloat(user.balance || 0)) {
                    Swal.fire('Error', 'Insufficient balance', 'error');
                    return;
                }
                
                const withdrawId = 'WD' + Date.now();
                await database.ref('withdrawals/' + withdrawId).set({
                    id: withdrawId,
                    userId: userId,
                    username: user.username,
                    amount: parseFloat(amount),
                    walletAddress: walletAddress,
                    status: 'pending',
                    requestDate: new Date().toISOString()
                });
                
                Swal.fire('Success', 'Withdrawal request submitted!', 'success');
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawPassword').value = '';
                
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        });
    </script>
</body>
</html>
