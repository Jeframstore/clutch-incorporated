<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Clutch Revenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f1a;
            color: white;
        }
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar */
        .admin-sidebar {
            width: 260px;
            background: #0a0a0f;
            border-right: 1px solid rgba(255,215,0,0.1);
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .small-c {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0a0a;
        }
        .sidebar-header h3 {
            color: #ffd700;
            font-size: 16px;
        }
        .admin-badge {
            background: rgba(255,215,0,0.15);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: auto;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .nav-item {
            background: none;
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            color: #aaa;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
        }
        .logout-btn {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            color: #ff6666;
            cursor: pointer;
            margin-top: 30px;
            width: 100%;
        }
        /* Main Content */
        .admin-main {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-header h1 {
            color: #ffd700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.1);
        }
        .stat-card h3 {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .stat-card .stat-value {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
        }
        .table-container {
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .data-table th {
            color: #ffd700;
        }
        .edit-btn, .approve-btn, .reject-btn, .delete-btn, .save-btn {
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
            border: none;
        }
        .edit-btn { background: rgba(255,215,0,0.2); color: #ffd700; }
        .approve-btn { background: rgba(0,255,0,0.2); color: #00ff00; }
        .reject-btn, .delete-btn { background: rgba(255,0,0,0.2); color: #ff6666; }
        .save-btn { background: #ffd700; color: #0a0a0a; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #aaa; margin-bottom: 8px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="sidebar-header">
                <div class="small-c">C</div>
                <h3>Clutch Admin</h3>
                <span class="admin-badge" id="adminTypeBadge"></span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>
        <div class="admin-main">
            <div class="admin-header">
                <h1 id="pageTitle">Dashboard</h1>
                <button class="logout-mobile" id="logoutMobileBtn" style="display: none;">🚪</button>
            </div>
            <div class="admin-content" id="adminContent"></div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
