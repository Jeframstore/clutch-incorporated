<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Clutch Incorporated</title>
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
        }
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        .admin-sidebar {
            width: 280px;
            background: rgba(10, 10, 15, 0.98);
            border-right: 1px solid rgba(255, 215, 0, 0.15);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            flex-wrap: wrap;
        }
        .small-c {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #0a0a0a;
        }
        .sidebar-header h3 {
            color: #ffd700;
            font-size: 16px;
        }
        .admin-badge {
            background: rgba(255, 215, 0, 0.2);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #ffd700;
            margin-left: auto;
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .nav-item {
            background: none;
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            color: #aaa;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }
        .nav-item.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }
        .logout-btn {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            color: #ff6666;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:hover {
            background: rgba(255, 0, 0, 0.2);
        }
        .admin-main {
            flex: 1;
            margin-left: 280px;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .admin-header h1 {
            color: #ffd700;
            font-size: 24px;
        }
        .logout-mobile {
            display: none;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            color: #ff6666;
            cursor: pointer;
        }
        .admin-content {
            background: rgba(18, 18, 26, 0.9);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            min-height: calc(100vh - 100px);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .stat-card h3 {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .stat-card .stat-value {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
        }
        .table-container {
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .data-table th {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
        }
        .data-table td {
            color: #aaa;
            font-size: 13px;
        }
        .edit-btn {
            background: rgba(255, 215, 0, 0.15);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            color: #ffd700;
            cursor: pointer;
            margin: 2px;
        }
        .delete-btn {
            background: rgba(255, 0, 0, 0.15);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            color: #ff6666;
            cursor: pointer;
            margin: 2px;
        }
        .approve-btn {
            background: rgba(0, 255, 0, 0.15);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            color: #00ff00;
            cursor: pointer;
        }
        .reject-btn {
            background: rgba(255, 0, 0, 0.15);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            color: #ff6666;
            cursor: pointer;
            margin-left: 5px;
        }
        .save-btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: #0a0a0a;
            font-weight: bold;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd700;
        }
        .special-badge {
            background: #ff4444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 1000;
                transition: transform 0.3s ease;
                width: 260px;
            }
            .admin-sidebar.open {
                transform: translateX(0);
            }
            .admin-main {
                margin-left: 0;
            }
            .logout-mobile {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="sidebar-header">
                <div class="small-c">C</div>
                <h3>Clutch Admin</h3>
                <span class="admin-badge" id="adminTypeBadge"></span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <div class="admin-main">
            <div class="admin-header">
                <h1 id="pageTitle">Dashboard</h1>
                <button class="logout-mobile" id="logoutMobileBtn">🚪</button>
            </div>
            <div class="admin-content" id="adminContent"></div>
        </div>
    </div>

    <script src="js/admin-dashboard.js"></script>
</body>
</html>
