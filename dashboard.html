<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard - Clutch Revenue</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-area">
                <img id="siteLogo" src="assets/images/logo.png" alt="Logo" onerror="this.style.display='none'">
                <span class="company-name">Clutch Incorporated</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Home</a>
                <a href="deposit.html">💳 Deposit</a>
                <a href="withdraw.html">💰 Withdraw</a>
                <a href="terms.html">📋 Terms & Conditions</a>
                <a href="faqs.html">❓ FAQS</a>
                <a href="about.html">ℹ️ About</a>
                <div class="sidebar-divider"></div>
                <a href="bind-wallet.html">🔗 Bind Wallet</a>
                <a href="service.html">📞 Contact Us</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="tasks-btn" onclick="location.href='starting.html'">TASKS</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p class="page-description">Welcome to Clutch Revenue</p>
            </div>
            
            <!-- Coins Section -->
            <div class="card">
                <div class="card-title">📈 Market Prices</div>
                <div class="coins-grid" id="coinsGrid"></div>
            </div>
            
            <!-- Records Section -->
            <div class="card">
                <div class="card-title">📊 Recent Activity</div>
                <div style="overflow-x: auto;">
                    <table class="records-table" id="recordsTable">
                        <thead>
                            <tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>
                        </thead>
                        <tbody id="recordsBody">
                            <tr><td colspan="4">Loading...</td><tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- RIGHT PROFILE PANEL -->
        <aside class="profile-panel">
            <div class="profile-content">
                <div class="avatar">👤</div>
                <div class="username" id="profileUsername">Loading...</div>
                
                <div class="section-title">ACCOUNT</div>
                <div class="account-details">
                    <p><span class="label">Joined:</span><span class="value" id="profileJoined">-</span></p>
                    <p><span class="label">Invite Code:</span><span class="value" id="profileInviteCode">-</span></p>
                    <p><span class="label">Balance:</span><span class="value" id="profileBalance">0 USDT</span></p>
                </div>
                
                <div class="section-title">ASSETS</div>
                <div class="coins-list" id="profileCoinsList"></div>
                <div class="dropdown-trigger" id="dropdownTrigger">▼ More Coins</div>
                <div class="dropdown-coins" id="dropdownCoins"></div>
            </div>
            <div class="profile-bottom">
                <button class="tradenow-btn" onclick="location.href='trading.html'">TRADE NOW</button>
            </div>
        </aside>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/main-layout.js"></script>
    <script>
        // Load records
        async function loadRecords() {
            const userId = localStorage.getItem('userId');
            const tbody = document.getElementById('recordsBody');
            
            try {
                const withdrawalsSnap = await database.ref('withdrawals').once('value');
                const depositsSnap = await database.ref('deposits').once('value');
                const withdrawals = withdrawalsSnap.val() || {};
                const deposits = depositsSnap.val() || {};
                
                let records = [];
                
                for (let id in withdrawals) {
                    const w = withdrawals[id];
                    if (w.userId === userId) {
                        records.push({
                            type: 'Withdraw',
                            amount: '-' + w.amount + ' USDT',
                            status: w.status,
                            date: new Date(w.requestDate).toLocaleDateString()
                        });
                    }
                }
                
                for (let id in deposits) {
                    const d = deposits[id];
                    if (d.userId === userId) {
                        records.push({
                            type: 'Deposit',
                            amount: '+' + d.amount + ' USDT',
                            status: d.status || 'Completed',
                            date: d.date
                        });
                    }
                }
                
                records.sort((a, b) => new Date(b.date) - new Date(a.date));
                records = records.slice(0, 10);
                
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No records found</td></tr>';
                } else {
                    tbody.innerHTML = records.map(r => `
                        <tr>
                            <td>${r.type}</td>
                            <td>${r.amount}</td>
                            <td class="status-${r.status.toLowerCase()}">${r.status}</td>
                            <td>${r.date}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading records:', error);
            }
        }
        
        // Override loadLivePrices to use our coins grid
        const originalLoadLivePrices = loadLivePrices;
        window.loadLivePrices = async function() {
            await originalLoadLivePrices();
            await loadRecords();
        };
        
        loadRecords();
    </script>
</body>
</html>
