<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login - Clutch Revenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18, 18, 26, 0.95);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #0a0a0a;
            margin: 0 auto 15px;
        }
        h2 {
            color: #9b59b6;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #9b59b6;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #0a0a0a;
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
        .signup-link a {
            color: #9b59b6;
            text-decoration: none;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="assets/images/logo.svg" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 10px;">
            <h2>Clutch Revenue</h2>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Username or Email</label>
                <input type="text" id="loginIdentifier" placeholder="Enter username or email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="loginMessage"></div>
        
        <div class="signup-link">
            New to Clutch? <a href="register.html">Sign up now</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const database = firebase.database();
        
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('loginMessage');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            messageDiv.innerHTML = '';
            
            try {
                const usersSnap = await database.ref('users').once('value');
                const users = usersSnap.val() || {};
                
                let foundUser = null;
                let foundUserId = null;
                
                for (let id in users) {
                    const user = users[id];
                    if ((user.username === identifier || user.email === identifier) && user.password === password) {
                        foundUser = user;
                        foundUserId = id;
                        break;
                    }
                }
                
                if (foundUser) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', foundUserId);
                    localStorage.setItem('username', foundUser.username);
                    window.location.href = 'dashboard.html';
                } else {
                    messageDiv.innerHTML = '<div class="error-message">Invalid username/email or password</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error-message">Database error. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
