<!DOCTYPE html>
<html lang="en">
<head>`n    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clutch Incorporated - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="big-c">C</div>
                <div class="logo-text">
                    <span class="clutch">Clutch</span>
                    <span class="incorporated">Incorporated</span>
                </div>
            </div>
            
            <h2 class="login-title">Login</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Username or Email</label>
                    <input type="text" id="loginIdentifier" placeholder="Enter username or email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                    <a href="forgot-password.html" style="color: #ffd700; font-size: 12px; text-decoration: none;">Forgot Password?</a>
                </div>
                
                <button type="submit" class="signin-btn">Sign in</button>
            </form>
            
            <div class="signup-link">
                New to Clutch? <a href="register.html">Sign up now.</a>
            </div>
            
            <div class="footer-text">
                © 2024 Clutch Incorporated. All rights reserved.
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
