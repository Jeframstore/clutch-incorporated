<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Login - Clutch Incorporated</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <link rel="stylesheet" href="dist/output.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18, 18, 26, 0.95);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
            color: #0a0a0a;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #0a0a0a;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="login-card">
        <div class="big-c">C</div>
        <h2>Clutch Incorporated</h2>
        <p class="subtitle">Admin Panel</p>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <label>Username or Email</label>
                <input type="text" id="adminIdentifier" placeholder="Enter username or email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="loginMessage"></div>
    </div>

    <script>
        
        let masterAdmin = null;
        
        async function loadMasterAdmin() {
            const snapshot = await database.ref('admins/master').once('value');
            masterAdmin = snapshot.val();
            console.log('Master admin loaded:', masterAdmin);
        }
        
        loadMasterAdmin();
        
        const loginForm = document.getElementById('adminLoginForm');
        const identifierInput = document.getElementById('adminIdentifier');
        const passwordInput = document.getElementById('adminPassword');
        const messageDiv = document.getElementById('loginMessage');
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;
            
            messageDiv.innerHTML = '';
            
            try {
                // Check Master Admin (No 2FA)
                if (masterAdmin && (identifier === masterAdmin.username || identifier === masterAdmin.email)) {
                    if (password !== masterAdmin.password) {
                        messageDiv.innerHTML = '<div class="error-message">Invalid password</div>';
                        return;
                    }
                    
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('adminType', 'master');
                    sessionStorage.setItem('adminUsername', masterAdmin.username);
                    sessionStorage.setItem('adminId', 'master');
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                
                // Check Sub Admins
                const subSnapshot = await database.ref('admins/sub').once('value');
                const subAdmins = subSnapshot.val() || {};
                
                for (let id in subAdmins) {
                    const admin = subAdmins[id];
                    if ((admin.username === identifier || admin.email === identifier) && admin.password === password) {
                        sessionStorage.setItem('isAdminLoggedIn', 'true');
                        sessionStorage.setItem('adminType', 'sub');
                        sessionStorage.setItem('adminUsername', admin.username);
                        sessionStorage.setItem('adminId', id);
                        window.location.href = 'admin-dashboard.html';
                        return;
                    }
                }
                
                messageDiv.innerHTML = '<div class="error-message">Invalid credentials</div>';
                
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.innerHTML = '<div class="error-message">Database error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
