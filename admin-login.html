<!DOCTYPE html>
<html lang="en">
<head>`n    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Login - Clutch Incorporated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18, 18, 26, 0.95);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
            color: #0a0a0a;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #0a0a0a;
        }
        button:hover {
            transform: scale(1.02);
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .otp-hint {
            font-size: 11px;
            color: #ffd700;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="big-c">C</div>
        <h2>Clutch Incorporated</h2>
        <p class="subtitle">Admin Panel</p>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <label>Username or Email</label>
                <input type="text" id="adminIdentifier" placeholder="Enter username or email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            
            <div id="otpSection" style="display: none;">
                <div class="input-group">
                    <label>2FA Code</label>
                    <input type="text" id="otpCode" placeholder="Enter 6-digit code" maxlength="6">
                    <div class="otp-hint" id="otpHint"></div>
                </div>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="loginMessage"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBwf-rkEWsNJRkh_TJeMSoNDc1iwO1c6tI",
            authDomain: "clutch-incorporated.firebaseapp.com",
            projectId: "clutch-incorporated",
            storageBucket: "clutch-incorporated.firebasestorage.app",
            messagingSenderId: "515595231583",
            appId: "1:515595231583:web:73ff8c3cdc123dcbce16ea",
            databaseURL: "https://clutch-incorporated-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let masterAdmin = null;
        
        // Load master admin from Firebase
        async function loadMasterAdmin() {
            const snapshot = await database.ref('admins/master').once('value');
            masterAdmin = snapshot.val();
            console.log('Master admin loaded:', masterAdmin);
        }
        
        loadMasterAdmin();
        
        const loginForm = document.getElementById('adminLoginForm');
        const identifierInput = document.getElementById('adminIdentifier');
        const passwordInput = document.getElementById('adminPassword');
        const otpSection = document.getElementById('otpSection');
        const otpInput = document.getElementById('otpCode');
        const otpHint = document.getElementById('otpHint');
        const messageDiv = document.getElementById('loginMessage');
        
        async function checkIfMaster() {
            const identifier = identifierInput.value.trim();
            
            if (masterAdmin && (identifier === masterAdmin.username || identifier === masterAdmin.email)) {
                otpSection.style.display = 'block';
                otpHint.textContent = 'Test 2FA Code: 123456';
            } else {
                otpSection.style.display = 'none';
                if (otpInput) otpInput.value = '';
            }
        }
        
        identifierInput.addEventListener('input', checkIfMaster);
        passwordInput.addEventListener('input', checkIfMaster);
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;
            const otpCode = otpInput ? otpInput.value : '';
            
            messageDiv.innerHTML = '';
            
            try {
                // Check Master Admin
                if (masterAdmin && (identifier === masterAdmin.username || identifier === masterAdmin.email)) {
                    if (password !== masterAdmin.password) {
                        messageDiv.innerHTML = '<div class="error-message">Invalid password</div>';
                        return;
                    }
                    
                    if (otpCode !== '123456') {
                        messageDiv.innerHTML = '<div class="error-message">Invalid 2FA code. Test code: 123456</div>';
                        return;
                    }
                    
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminType', 'master');
                    localStorage.setItem('adminUsername', masterAdmin.username);
                    localStorage.setItem('adminId', 'master');
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                
                // Check Sub Admins
                const subSnapshot = await database.ref('admins/sub').once('value');
                const subAdmins = subSnapshot.val() || {};
                
                let foundSubAdmin = null;
                for (let id in subAdmins) {
                    const admin = subAdmins[id];
                    if ((admin.username === identifier || admin.email === identifier) && admin.password === password) {
                        foundSubAdmin = admin;
                        foundSubAdmin.id = id;
                        break;
                    }
                }
                
                if (foundSubAdmin) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminType', 'sub');
                    localStorage.setItem('adminUsername', foundSubAdmin.username);
                    localStorage.setItem('adminId', foundSubAdmin.id);
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                
                messageDiv.innerHTML = '<div class="error-message">Invalid credentials</div>';
                
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.innerHTML = '<div class="error-message">Database error</div>';
            }
        });
    </script>
</body>
</html>
