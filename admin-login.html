<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Login - Clutch Revenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18, 18, 26, 0.95);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #0a0a0a;
            margin: 0 auto 15px;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #0a0a0a;
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="assets/images/logo.svg" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 10px;">
            <h2>Clutch Revenue</h2>
            <p class="subtitle">Admin Panel</p>
        </div>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="adminUsername" placeholder="Enter username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="loginMessage"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const database = firebase.database();
        
        const loginForm = document.getElementById('adminLoginForm');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const messageDiv = document.getElementById('loginMessage');
            
            messageDiv.innerHTML = '';
            
            try {
                const masterSnap = await database.ref('admins/master').once('value');
                const master = masterSnap.val();
                
                if (master && master.username === username && master.password === password) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminType', 'master');
                    localStorage.setItem('adminUsername', username);
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                
                const subSnap = await database.ref('admins/sub').once('value');
                const subs = subSnap.val() || {};
                
                for (let id in subs) {
                    const admin = subs[id];
                    if (admin.username === username && admin.password === password) {
                        localStorage.setItem('isAdminLoggedIn', 'true');
                        localStorage.setItem('adminType', 'sub');
                        localStorage.setItem('adminUsername', username);
                        localStorage.setItem('adminId', id);
                        window.location.href = 'admin-dashboard.html';
                        return;
                    }
                }
                
                messageDiv.innerHTML = '<div class="error-message">Invalid credentials</div>';
                
            } catch (error) {
                messageDiv.innerHTML = '<div class="error-message">Database error</div>';
            }
        });
    </script>
</body>
</html>
