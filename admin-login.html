<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Clutch Incorporated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18, 18, 26, 0.95);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            transform: scale(1.02);
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
        }
        .otp-hint {
            font-size: 11px;
            color: #ffd700;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="big-c">C</div>
        <h2>Clutch Incorporated</h2>
        <p class="subtitle">Admin Panel</p>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <label>Username or Email</label>
                <input type="text" id="adminIdentifier" placeholder="Enter username or email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            
            <div id="otpSection" style="display: none;">
                <div class="input-group">
                    <label>2FA Code</label>
                    <input type="text" id="otpCode" placeholder="Enter 6-digit code" maxlength="6">
                    <div class="otp-hint" id="otpHint"></div>
                </div>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="loginMessage"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBwf-rkEWsNJRkh_TJeMSoNDc1iwO1c6tI",
            authDomain: "clutch-incorporated.firebaseapp.com",
            projectId: "clutch-incorporated",
            storageBucket: "clutch-incorporated.firebasestorage.app",
            messagingSenderId: "515595231583",
            appId: "1:515595231583:web:73ff8c3cdc123dcbce16ea",
            databaseURL: "https://clutch-incorporated-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        console.log("Firebase initialized");
        
        const loginForm = document.getElementById('adminLoginForm');
        const identifierInput = document.getElementById('adminIdentifier');
        const passwordInput = document.getElementById('adminPassword');
        const otpSection = document.getElementById('otpSection');
        const otpInput = document.getElementById('otpCode');
        const otpHint = document.getElementById('otpHint');
        const messageDiv = document.getElementById('loginMessage');
        
        let masterAdmin = null;
        
        // Load master admin data from correct path (admins/)
        async function loadMasterAdmin() {
            try {
                const snapshot = await database.ref('admins').once('value');
                masterAdmin = snapshot.val();
                console.log("Master admin loaded:", masterAdmin);
            } catch (error) {
                console.error("Error loading master admin:", error);
            }
        }
        
        // Check if entered credentials match master admin
        async function checkIfMaster() {
            const identifier = identifierInput.value.trim();
            
            if (masterAdmin && (identifier === masterAdmin.username || identifier === masterAdmin.email)) {
                otpSection.style.display = 'block';
                otpHint.textContent = 'Test 2FA Code: 123456';
            } else {
                otpSection.style.display = 'none';
                if (otpInput) otpInput.value = '';
            }
        }
        
        // Load master admin on page load
        loadMasterAdmin();
        
        identifierInput.addEventListener('input', checkIfMaster);
        passwordInput.addEventListener('input', checkIfMaster);
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;
            const otpCode = otpInput ? otpInput.value : '';
            
            messageDiv.innerHTML = '';
            
            try {
                // Ensure masterAdmin is loaded
                if (!masterAdmin) {
                    await loadMasterAdmin();
                }
                
                // Check master admin
                if (masterAdmin && (identifier === masterAdmin.username || identifier === masterAdmin.email)) {
                    // Check password
                    if (password !== masterAdmin.password) {
                        messageDiv.innerHTML = '<div class="error-message">Invalid password</div>';
                        return;
                    }
                    
                    // Check 2FA (test code: 123456)
                    if (!otpCode || otpCode !== '123456') {
                        messageDiv.innerHTML = '<div class="error-message">Invalid 2FA code. Use: 123456</div>';
                        return;
                    }
                    
                    // Login successful
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminType', 'master');
                    localStorage.setItem('adminUsername', masterAdmin.username);
                    localStorage.setItem('adminId', 'master');
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                
                // Check sub admins (if any exist in future)
                messageDiv.innerHTML = '<div class="error-message">Invalid credentials</div>';
                
            } catch (error) {
                console.error("Login error:", error);
                messageDiv.innerHTML = '<div class="error-message">Database error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
