<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FAQS - Clutch Revenue</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img id="siteLogo" src="assets/images/logo.svg" alt="Logo" onerror="this.style.display='none'">
                <span class="company-name">Clutch Incorporated</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Home</a>
                <a href="deposit.html">💳 Deposit</a>
                <a href="withdraw.html">💰 Withdraw</a>
                <a href="terms.html">📋 Terms & Conditions</a>
                <a href="faqs.html">❓ FAQS</a>
                <a href="about.html">ℹ️ About</a>
                <div class="sidebar-divider"></div>
                <a href="bind-wallet.html">🔗 Bind Wallet</a>
                <a href="service.html">📞 Contact Us</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="tasks-btn" onclick="location.href='starting.html'">TASKS</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Frequently Asked Questions</h1>
                <p class="page-description">Find answers to common questions</p>
            </div>
            
            <div class="card">
                <div id="faqsViewer" style="min-height: 500px;">
                    <div style="text-align: center; padding: 40px;">Loading FAQS...</div>
                </div>
            </div>
        </main>

        <aside class="profile-panel">
            <div class="profile-content">
                <div class="avatar">👤</div>
                <div class="username" id="profileUsername">Loading...</div>
                <div class="section-title">ACCOUNT</div>
                <div class="account-details">
                    <p><span class="label">Joined:</span><span class="value" id="profileJoined">-</span></p>
                    <p><span class="label">Invite Code:</span><span class="value" id="profileInviteCode">-</span></p>
                    <p><span class="label">Balance:</span><span class="value" id="profileBalance">0 USDT</span></p>
                </div>
                <div class="section-title">ASSETS</div>
                <div class="coins-list" id="profileCoinsList"></div>
                <div class="dropdown-trigger" id="dropdownTrigger">▼ More Coins</div>
                <div class="dropdown-coins" id="dropdownCoins"></div>
            </div>
            <div class="profile-bottom">
                <button class="tradenow-btn" onclick="location.href='trading.html'">TRADE NOW</button>
            </div>
        </aside>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/main-layout.js"></script>
    <script>
        async function loadFAQS() {
            const snap = await database.ref('settings/faqsPDF').once('value');
            const pdfUrl = snap.val();
            const container = document.getElementById('faqsViewer');
            
            if (pdfUrl) {
                container.innerHTML = `<iframe src="${pdfUrl}" style="width:100%; height:600px; border:none; border-radius:12px;"></iframe>`;
            } else {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No FAQS document uploaded yet.</div>';
            }
        }
        loadFAQS();
    </script>
</body>
</html>
