<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Incorporated - Deposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0A0A; color: white; margin: 0; }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marquee-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        .marquee-anim { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .nav-btn.active { color: #FFD800; }
        .nav-indicator { box-shadow: 0 0 15px #FFD800; }
        
        ::-webkit-scrollbar { display: none; }

        .qr-card { background: white; padding: 1.5rem; border-radius: 2rem; box-shadow: 0 20px 50px rgba(255, 216, 0, 0.15); }
    </style>
</head>
<body class="bg-[#0A0A0A] flex justify-center">
    <div class="flex flex-col min-h-screen w-full max-w-[375px] bg-[#0A0A0A] text-white relative pb-[100px] border-x border-white/5">
        
        <!-- Header -->
        <header class="sticky top-0 z-[60] glass-header px-6 py-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#FFD800] shadow-[0_0_20px_rgba(255,216,0,0.3)]">
                        <img src="https://cdn.jsdelivr.net/npm/game-icons-transparent@latest/svgs/lorc/cog.svg" class="w-7 h-7" alt="Logo">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jakarta text-lg font-extrabold tracking-tighter leading-none">CLUTCH</span>
                        <span class="text-[10px] text-white/40 font-bold uppercase tracking-[0.2em] mt-0.5">Incorporated</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="w-11 h-11 rounded-full border-2 border-white/10 flex items-center justify-center hover:border-[#FFD800] transition-colors">
                        <i class="ti ti-arrow-left text-white text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-hidden marquee-container rounded-lg py-1.5 mt-2">
                <div class="marquee-anim text-[9px] font-black text-[#80FF00]/90 uppercase tracking-widest px-4">
                    • Secure Deposit • Fund Your Portfolio • Welcome <span id="usernameDisplay" class="text-white">User</span> •
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-6 space-y-8">
            <div>
                <div class="inline-flex items-center gap-2 bg-[#FFD800]/10 border border-[#FFD800]/20 px-3 py-1 rounded-full mb-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-[#FFD800] animate-pulse"></div>
                    <span class="text-[9px] font-black text-[#FFD800] uppercase tracking-widest">Instant Nodes</span>
                </div>
                <h1 class="font-jakarta text-4xl font-extrabold tracking-tight">Deposit</h1>
                <p class="text-white/40 text-xs mt-2">Fund your high-performance portfolio via USDT.</p>
            </div>

            <section class="bg-[#1B1B1B] rounded-[40px] p-10 flex flex-col items-center border border-white/5 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-[#FFD800]/5 rounded-full blur-[40px] -mr-16 -mt-16"></div>
                
                <div class="qr-card mb-8">
                    <img id="merchantQr" src="" alt="QR" class="w-40 h-40">
                </div>

                <div class="w-full space-y-4">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-[9px] font-black text-white/30 uppercase tracking-[0.2em]">USDT (TRC20) ADDRESS</label>
                        <span class="text-[8px] font-bold text-[#80FF00] uppercase">Verified</span>
                    </div>
                    <div class="flex items-center gap-3 bg-black/40 border border-white/5 rounded-2xl p-4">
                        <code id="merchantAddress" class="text-[10px] text-white/80 truncate flex-1 font-mono tracking-widest uppercase">Loading...</code>
                        <button id="copyMerchantAddress" class="text-[#FFD800] p-2 hover:bg-[#FFD800]/10 rounded-xl transition-all">
                            <i class="ti ti-copy"></i>
                        </button>
                    </div>
                </div>
            </section>

            <div class="bg-gradient-to-br from-[#80FF00]/10 to-transparent p-6 rounded-[32px] border border-[#80FF00]/20 space-y-5">
                <h4 class="font-jakarta font-bold text-sm text-[#80FF00] uppercase tracking-widest text-center">Concierge Sync</h4>
                <p class="text-white/60 text-[11px] text-center px-4">Please contact support after sending funds for priority node activation.</p>
                
                <div class="flex gap-3">
                    <button id="whatsappBtn" class="flex-1 flex flex-col items-center gap-2 bg-black/40 border border-white/5 p-4 rounded-2xl hover:border-[#80FF00]/40 transition-all">
                        <i class="ti ti-brand-whatsapp text-[#80FF00] text-xl"></i>
                        <span class="text-[9px] font-black uppercase tracking-tighter" id="whatsappNumber">Loading...</span>
                    </button>
                    <button id="telegramBtn" class="flex-1 flex flex-col items-center gap-2 bg-black/40 border border-white/5 p-4 rounded-2xl hover:border-[#80FF00]/40 transition-all">
                        <i class="ti ti-brand-telegram text-[#80FF00] text-xl"></i>
                        <span class="text-[9px] font-black uppercase tracking-tighter" id="telegramUsername">Loading...</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-[100] bg-[#0A0A0A]/95 backdrop-blur-2xl border-t border-white/10 px-8 py-4 pb-8 flex justify-between items-center">
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="home">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-home text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="starting">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-rocket text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Start</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 cursor-pointer nav-btn" data-page="records">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center">
                    <i class="ti ti-list text-white text-2xl"></i>
                </div>
                <span class="text-white text-[10px] font-black uppercase tracking-[0.2em]">Records</span>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/deposit.js"></script>
</body>
</html>
