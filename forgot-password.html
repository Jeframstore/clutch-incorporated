<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Forgot Password - Clutch Incorporated</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .forgot-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(18, 18, 26, 0.95);
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .step { display: none; }
        .step.active { display: block; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #ffd700; text-decoration: none; }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
        }
        .success-message {
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #00ff00;
            margin-top: 15px;
            text-align: center;
        }
        .resend-btn {
            background: none;
            border: none;
            color: #ffd700;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="forgot-container">
        <div class="logo-section" style="text-align: center; margin-bottom: 25px;">
            <div class="big-c" style="margin: 0 auto 15px;">C</div>
            <h2 style="color: #ffd700;">Clutch Incorporated</h2>
            <p style="color: #888;">Reset Password</p>
        </div>

        <div id="step1" class="step active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your registered email" class="form-input">
            </div>
            <button id="sendOtpBtn" class="signin-btn">Send OTP</button>
            <div id="step1Message"></div>
        </div>

        <div id="step2" class="step">
            <div class="input-group">
                <label>OTP Code</label>
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6" class="form-input">
            </div>
            <button id="verifyOtpBtn" class="signin-btn">Verify OTP</button>
            <button id="resendOtpBtn" class="resend-btn">Resend OTP</button>
            <div id="step2Message"></div>
        </div>

        <div id="step3" class="step">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" class="form-input">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" class="form-input">
            </div>
            <button id="resetPasswordBtn" class="signin-btn">Reset Password</button>
            <div id="step3Message"></div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let currentOtp = '';
        let userIdFound = null;

        document.getElementById('sendOtpBtn').addEventListener('click', async function() {
            const email = document.getElementById('resetEmail').value.trim();
            const messageDiv = document.getElementById('step1Message');
            
            if (!email) {
                messageDiv.innerHTML = '<div class="error-message">Please enter your email</div>';
                return;
            }
            
            try {
                const usersSnapshot = await database.ref('users').once('value');
                const users = usersSnapshot.val() || {};
                let user = null;
                let userId = null;
                
                for (let id in users) {
                    if (users[id].email === email) {
                        user = users[id];
                        userId = id;
                        break;
                    }
                }
                
                if (!user) {
                    messageDiv.innerHTML = '<div class="error-message">Email not found. Please register first.</div>';
                    return;
                }
                
                currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
                currentEmail = email;
                userIdFound = userId;
                
                // Store OTP in Firebase
                await database.ref('resetOtps/' + email).set({
                    otp: currentOtp,
                    expiry: Date.now() + 10 * 60 * 1000,
                    userId: userId
                });
                
                messageDiv.innerHTML = `<div class="success-message">OTP sent to ${email}<br><strong>Test OTP: ${currentOtp}</strong></div>`;
                
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error-message">Database error. Please try again.</div>';
            }
        });
        
        document.getElementById('verifyOtpBtn').addEventListener('click', async function() {
            const enteredOtp = document.getElementById('otpCode').value;
            const messageDiv = document.getElementById('step2Message');
            
            try {
                const otpSnapshot = await database.ref('resetOtps/' + currentEmail).once('value');
                const otpData = otpSnapshot.val();
                
                if (!otpData) {
                    messageDiv.innerHTML = '<div class="error-message">No OTP request found. Please restart.</div>';
                    return;
                }
                
                if (Date.now() > otpData.expiry) {
                    messageDiv.innerHTML = '<div class="error-message">OTP expired. Please request a new one.</div>';
                    return;
                }
                
                if (enteredOtp !== otpData.otp) {
                    messageDiv.innerHTML = '<div class="error-message">Invalid OTP. Please try again.</div>';
                    return;
                }
                
                messageDiv.innerHTML = '<div class="success-message">OTP verified! Set your new password.</div>';
                
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
                
            } catch (error) {
                messageDiv.innerHTML = '<div class="error-message">Error verifying OTP</div>';
            }
        });
        
        document.getElementById('resendOtpBtn').addEventListener('click', async function() {
            currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
            
            await database.ref('resetOtps/' + currentEmail).set({
                otp: currentOtp,
                expiry: Date.now() + 10 * 60 * 1000,
                userId: userIdFound
            });
            
            document.getElementById('step2Message').innerHTML = `<div class="success-message">New OTP sent! Test OTP: ${currentOtp}</div>`;
        });
        
        document.getElementById('resetPasswordBtn').addEventListener('click', async function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('step3Message');
            
            if (!newPassword || newPassword.length < 4) {
                messageDiv.innerHTML = '<div class="error-message">Password must be at least 4 characters</div>';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error-message">Passwords do not match</div>';
                return;
            }
            
            try {
                await database.ref('users/' + userIdFound).update({ password: newPassword });
                await database.ref('resetOtps/' + currentEmail).remove();
                
                messageDiv.innerHTML = '<div class="success-message">Password reset successfully! Redirecting to login...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (error) {
                messageDiv.innerHTML = '<div class="error-message">Error resetting password</div>';
            }
        });
    </script>
</body>
</html>
