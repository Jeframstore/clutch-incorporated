<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Forgot Password - Clutch Incorporated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(18, 18, 26, 0.95);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            transform: scale(1.02);
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .success-message {
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #00ff00;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #ffd700;
            text-decoration: none;
            font-size: 13px;
        }
        .resend-btn {
            background: none;
            border: none;
            color: #ffd700;
            margin-top: 10px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="big-c">C</div>
        <h2>Clutch Incorporated</h2>
        <p class="subtitle">Reset Your Password</p>

        <!-- Step 1: Enter Email -->
        <div id="step1" class="step active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your registered email">
            </div>
            <button id="sendOtpBtn">Send OTP</button>
            <div id="step1Message"></div>
        </div>

        <!-- Step 2: Enter OTP -->
        <div id="step2" class="step">
            <div class="input-group">
                <label>OTP Code</label>
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>
            <button id="verifyOtpBtn">Verify OTP</button>
            <button id="resendOtpBtn" class="resend-btn">Resend OTP</button>
            <div id="step2Message"></div>
        </div>

        <!-- Step 3: Set New Password -->
        <div id="step3" class="step">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <button id="resetPasswordBtn">Reset Password</button>
            <div id="step3Message"></div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let currentOtp = '';
        let userIdFound = null;

        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const email = document.getElementById('resetEmail').value.trim();
            const messageDiv = document.getElementById('step1Message');
            
            if (!email) {
                messageDiv.innerHTML = '<div class="error-message">Please enter your email</div>';
                return;
            }
            
            let users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            const user = users.find(function(u) { return u.email === email; });
            
            if (!user) {
                messageDiv.innerHTML = '<div class="error-message">Email not found. Please register first.</div>';
                return;
            }
            
            currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
            currentEmail = email;
            userIdFound = user.id;
            
            localStorage.setItem('resetOtp_' + email, currentOtp);
            localStorage.setItem('resetOtpExpiry_' + email, Date.now() + 10 * 60 * 1000);
            
            messageDiv.innerHTML = `<div class="success-message">OTP sent to ${email}<br><strong>Test OTP: ${currentOtp}</strong></div>`;
            
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        });
        
        document.getElementById('verifyOtpBtn').addEventListener('click', function() {
            const enteredOtp = document.getElementById('otpCode').value;
            const messageDiv = document.getElementById('step2Message');
            const storedOtp = localStorage.getItem('resetOtp_' + currentEmail);
            const expiry = localStorage.getItem('resetOtpExpiry_' + currentEmail);
            
            if (!storedOtp) {
                messageDiv.innerHTML = '<div class="error-message">No OTP request found. Please restart.</div>';
                return;
            }
            
            if (Date.now() > parseInt(expiry)) {
                messageDiv.innerHTML = '<div class="error-message">OTP expired. Please request a new one.</div>';
                return;
            }
            
            if (enteredOtp !== storedOtp) {
                messageDiv.innerHTML = '<div class="error-message">Invalid OTP. Please try again.</div>';
                return;
            }
            
            messageDiv.innerHTML = '<div class="success-message">OTP verified! Set your new password.</div>';
            
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        });
        
        document.getElementById('resendOtpBtn').addEventListener('click', function() {
            currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('resetOtp_' + currentEmail, currentOtp);
            localStorage.setItem('resetOtpExpiry_' + currentEmail, Date.now() + 10 * 60 * 1000);
            
            document.getElementById('step2Message').innerHTML = `<div class="success-message">New OTP sent! Test OTP: ${currentOtp}</div>`;
        });
        
        document.getElementById('resetPasswordBtn').addEventListener('click', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('step3Message');
            
            if (!newPassword || newPassword.length < 4) {
                messageDiv.innerHTML = '<div class="error-message">Password must be at least 4 characters</div>';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error-message">Passwords do not match</div>';
                return;
            }
            
            let users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            const userIndex = users.findIndex(function(u) { return u.id === userIdFound; });
            
            if (userIndex !== -1) {
                users[userIndex].password = newPassword;
                localStorage.setItem('registeredUsers', JSON.stringify(users));
                
                localStorage.removeItem('resetOtp_' + currentEmail);
                localStorage.removeItem('resetOtpExpiry_' + currentEmail);
                
                messageDiv.innerHTML = '<div class="success-message">Password reset successfully! Redirecting to login...</div>';
                
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                messageDiv.innerHTML = '<div class="error-message">User not found. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
