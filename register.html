<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Register - Clutch Incorporated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: rgba(18, 18, 26, 0.95);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .big-c {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #0a0a0a;
            margin: 0 auto 15px;
        }
        h2 {
            color: #9b59b6;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #9b59b6;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #0a0a0a;
        }
        .error-message {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #ff6666;
            margin-top: 15px;
            text-align: center;
        }
        .success-message {
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            padding: 10px;
            border-radius: 10px;
            color: #00ff00;
            margin-top: 15px;
            text-align: center;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
        .login-link a {
            color: #9b59b6;
            text-decoration: none;
        }
    </style>
    <!-- Firebase SDK - loaded once -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="register-card">
        <div class="logo-area">
            <div class="big-c">C</div>
            <h2>Create Account</h2>
        </div>
        
        <form id="registerForm">
            <div class="input-group">
                <label>Invitation Code</label>
                <input type="text" id="inviteCode" placeholder="Enter invitation code" required>
            </div>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit">Sign Up</button>
        </form>
        
        <div id="message"></div>
        
        <div class="login-link">
            Already have an account? <a href="index.html">Login</a>
        </div>
    </div>

    <!-- Firebase config - loaded once -->
    <script src="js/firebase-config.js"></script>
    <script>
        // database is already defined in firebase-config.js - DO NOT redeclare
        
        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const inviteCode = document.getElementById('inviteCode').value.trim().toUpperCase();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            messageDiv.innerHTML = '';
            
            if (!inviteCode) {
                messageDiv.innerHTML = '<div class="error-message">Invitation code required</div>';
                return;
            }
            
            if (username.length < 3) {
                messageDiv.innerHTML = '<div class="error-message">Username must be at least 3 characters</div>';
                return;
            }
            
            if (!email.includes('@')) {
                messageDiv.innerHTML = '<div class="error-message">Valid email required</div>';
                return;
            }
            
            if (password.length < 4) {
                messageDiv.innerHTML = '<div class="error-message">Password must be at least 4 characters</div>';
                return;
            }
            
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error-message">Passwords do not match</div>';
                return;
            }
            
            try {
                const codesSnap = await database.ref('invitationCodes').once('value');
                const codes = codesSnap.val() || {};
                const today = new Date().toISOString().split('T')[0];
                
                let validCode = null;
                for (let id in codes) {
                    const code = codes[id];
                    if (code.code === inviteCode && code.date === today && code.active === true) {
                        validCode = code;
                        break;
                    }
                }
                
                if (!validCode) {
                    messageDiv.innerHTML = '<div class="error-message">Invalid or expired invitation code</div>';
                    return;
                }
                
                const usersSnap = await database.ref('users').once('value');
                const users = usersSnap.val() || {};
                
                for (let id in users) {
                    if (users[id].username === username || users[id].email === email) {
                        messageDiv.innerHTML = '<div class="error-message">Username or email already exists</div>';
                        return;
                    }
                }
                
                const userId = 'UID' + Date.now();
                const newUser = {
                    username: username,
                    email: email,
                    password: password,
                    inviteCode: inviteCode,
                    assignedAdminId: validCode.adminId,
                    assignedAdminName: validCode.adminName,
                    balance: '0.00',
                    commission: '0.00',
                    status: 'active',
                    joinedDate: today,
                    completedTasks: 0,
                    totalTasks: 24
                };
                
                await database.ref('users/' + userId).set(newUser);
                messageDiv.innerHTML = '<div class="success-message">Registration successful! Redirecting to login...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (error) {
                console.error('Registration error:', error);
                messageDiv.innerHTML = '<div class="error-message">Database error. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
